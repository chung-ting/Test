<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穿搭分析</title>
<style>
  :root {
    --bg: #faf7f4; --card: #ffffff; --text: #2b2724; --muted: #7a716a;
    --accent: #b5543c; --accent-text: #ffffff; --border: #e8e1da; --good: #3d7a52; --warn: #b07a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a19; --card: #262321; --text: #f0ebe6; --muted: #a59d96;
      --accent: #e07a5f; --accent-text: #1c1a19; --border: #3a3633; --good: #7cc495; --warn: #e0b45f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
                 border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); width: 100%;
                 font-weight: 600; padding: 14px; margin-top: 12px; }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  input[type=file] { display: none; }
  #preview { display: none; width: 100%; max-height: 420px; object-fit: contain; border-radius: 12px; margin-top: 12px; background: var(--bg); }
  textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
             border-radius: 12px; padding: 10px; margin-top: 12px; resize: vertical; }
  .error { color: var(--accent); }
  .loading { text-align: center; color: var(--muted); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; margin: 0 auto 8px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .score { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .score b { font-size: 2.4rem; color: var(--accent); line-height: 1; }
  ul { margin: 4px 0 12px; padding-left: 1.2em; }
  .label-good { color: var(--good); font-weight: 600; }
  .label-warn { color: var(--warn); font-weight: 600; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 12px; }
  .swatch { display: flex; flex-direction: column; align-items: center; width: 64px; font-size: .8rem; text-align: center; }
  .swatch span { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); margin-bottom: 4px; }
  .look h3 { margin: 0 0 8px; font-size: 1rem; }
  .look table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .look td { padding: 6px 4px; border-top: 1px solid var(--border); vertical-align: top; }
  .look td:first-child { color: var(--muted); white-space: nowrap; width: 4.5em; }
  .why { color: var(--muted); font-size: .95rem; margin: 0; }
  .privacy { color: var(--muted); font-size: .85rem; text-align: center; }
  .tabs { display: flex; gap: 4px; margin: 12px 0 16px; border-bottom: 1px solid var(--border); }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 10px 14px; color: var(--muted);
                 border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .hint { color: var(--muted); font-size: .9rem; margin: -4px 0 12px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .fields label { display: flex; flex-direction: column; font-weight: 600; font-size: .95rem; }
  .fields small { color: var(--muted); font-weight: 400; font-size: .8rem; }
  input[type=number] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
                       border-radius: 10px; padding: 8px 10px; width: 100%; margin-top: 4px; }
  .preview { display: none; width: 100%; max-height: 320px; object-fit: contain; border-radius: 12px; margin-top: 12px; }
  .big-size { font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .warn { color: var(--warn); }
  .size-row { border-top: 1px solid var(--border); padding: 10px 0; }
  .size-row.best { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 10px; padding: 10px 8px; }
  .size-row h3 { margin: 0 0 4px; font-size: 1rem; }
  .verdicts { display: flex; flex-wrap: wrap; gap: 6px; font-size: .85rem; }
  .verdict { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .verdict.ok { color: var(--good); border-color: var(--good); }
  .verdict.off { color: var(--warn); border-color: var(--warn); }
  .chart-scroll { overflow-x: auto; }
  .chart-table { border-collapse: collapse; font-size: .9rem; }
  .chart-table th, .chart-table td { padding: 4px; text-align: center; white-space: nowrap; }
  .chart-table input { width: 4.5em; margin: 0; padding: 4px 6px; }
</style>
</head>
<body>
<main>
  <h1>穿搭分析</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="analyze" aria-selected="true">👗 穿搭建議</button>
    <button role="tab" data-tab="size" aria-selected="false">📏 尺寸推薦</button>
  </nav>

  <div id="tab-analyze">
  <p class="sub">拍一張全身照，AI 幫你分析目前的穿搭，並給出適合你的建議。</p>

  <section class="card">
    <h2>1. 拍照或選照片</h2>
    <div class="row">
      <label class="btn">📷 拍照<input id="camera" type="file" accept="image/*" capture="environment"></label>
      <label class="btn">🖼️ 從相簿選<input id="gallery" type="file" accept="image/*"></label>
    </div>
    <img id="preview" alt="照片預覽">
  </section>

  <section class="card">
    <h2>2. 要穿去哪裡？</h2>
    <div class="row" id="occasions"></div>
    <textarea id="note" rows="2" maxlength="200" placeholder="（選填）例如：想看起來高一點、不喜歡太亮的顏色"></textarea>
    <button class="btn-primary" id="submit" disabled>開始分析</button>
  </section>

  <div id="status"></div>
  <div id="result"></div>
  </div>

  <div id="tab-size" hidden>
  <p class="sub">拿一件你穿起來最合身的衣服來比對商品尺寸表，算出該買哪一號。</p>

  <section class="card">
    <h2>1. 量一件你最合身的衣服</h2>
    <p class="hint">衣服平放在桌上，用軟尺量，單位公分。不用每項都填，但胸寬或腰寬最重要。</p>
    <div class="row" id="categories">
      <button class="chip" data-cat="top" aria-pressed="true">上衣</button>
      <button class="chip" data-cat="bottom" aria-pressed="false">褲子／裙子</button>
    </div>
    <div id="ref-fields" class="fields"></div>
  </section>

  <section class="card">
    <h2>2. 上傳商品的尺寸表截圖</h2>
    <label class="btn">🖼️ 選擇截圖<input id="chart-file" type="file" accept="image/*"></label>
    <img id="chart-preview" class="preview" alt="尺寸表預覽">
    <button class="btn-primary" id="chart-submit" disabled>讀取尺寸表並推薦</button>
  </section>

  <div id="size-status"></div>
  <div id="size-result"></div>
  </div>

  <p class="privacy">照片會傳送到 Anthropic 的 Claude 進行分析，本站不會儲存。</p>
</main>

<script>
const MAX_SIDE = 1568;  // Claude downsizes larger images anyway; resizing first saves upload time
let imageData = null;
let occasion = "daily";

const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") node.style.cssText = v; else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

fetch("/api/occasions").then((r) => r.json()).then((occasions) => {
  for (const [key, label] of Object.entries(occasions)) {
    const chip = el("button", { class: "chip", "aria-pressed": String(key === occasion) }, label);
    chip.onclick = () => {
      occasion = key;
      document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
    };
    $("occasions").append(chip);
  }
});

function resize(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const canvas = el("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => reject(new Error("無法讀取這張照片"));
    img.src = URL.createObjectURL(file);
  });
}

async function onPick(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    imageData = await resize(file);
    $("preview").src = imageData;
    $("preview").style.display = "block";
    $("submit").disabled = false;
    $("result").replaceChildren();
    $("status").replaceChildren();
  } catch (err) {
    showError(err.message);
  }
}
$("camera").onchange = onPick;
$("gallery").onchange = onPick;

function showError(msg) {
  $("status").replaceChildren(el("div", { class: "card error" }, msg));
}

$("submit").onclick = async () => {
  $("submit").disabled = true;
  $("result").replaceChildren();
  $("status").replaceChildren(el("div", { class: "card loading" }, el("div", { class: "spinner" }), "分析中，大約需要 20–40 秒…"));
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageData, occasion, note: $("note").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "分析失敗，請再試一次");
    $("status").replaceChildren();
    render(data);
    $("result").scrollIntoView({ behavior: "smooth" });
  } catch (err) {
    showError(err.message === "Failed to fetch" ? "連不上伺服器，請確認網路" : err.message);
  } finally {
    $("submit").disabled = false;
  }
};

function list(items) { return el("ul", {}, ...items.map((t) => el("li", {}, t))); }
function swatches(colors) {
  const safe = (hex) => /^#[0-9a-fA-F]{3,8}$/.test(hex) ? hex : "transparent";
  return el("div", { class: "swatches" },
    ...colors.map((c) => el("div", { class: "swatch" }, el("span", { style: `background:${safe(c.hex)}` }), c.name)));
}

// ---------- tabs ----------
document.querySelectorAll("[role=tab]").forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll("[role=tab]").forEach((t) => {
      t.setAttribute("aria-selected", String(t === tab));
      $("tab-" + t.dataset.tab).hidden = t !== tab;
    });
  };
});

// ---------- size recommendation ----------
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
let measures = {};
let category = "top";
let reference = store.get("outfit.reference") || { top: {}, bottom: {} };
let chartImage = null;
let chart = null;

async function postJSON(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "發生錯誤，請再試一次");
  return data;
}
function sizeError(msg) { $("size-status").replaceChildren(el("div", { class: "card error" }, msg)); }

function renderRefFields() {
  document.querySelectorAll("#categories .chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.cat === category)));
  const fields = Object.entries(measures[category] || {}).map(([key, m]) => {
    const input = el("input", { type: "number", inputmode: "decimal", step: "0.5", min: "1", placeholder: "cm" });
    input.value = reference[category][key] ?? "";
    input.oninput = () => {
      const v = parseFloat(input.value);
      if (Number.isFinite(v) && v > 0) reference[category][key] = v; else delete reference[category][key];
      store.set("outfit.reference", reference);
      if (chart && chart.category === category) recompute();
    };
    return el("label", {}, m.label, el("small", {}, m.hint), input);
  });
  $("ref-fields").replaceChildren(...fields);
}
document.querySelectorAll("#categories .chip").forEach((c) => {
  c.onclick = () => { category = c.dataset.cat; renderRefFields(); };
});
fetch("/api/measures").then((r) => r.json()).then((m) => { measures = m; renderRefFields(); });

$("chart-file").onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    chartImage = await resize(file);
    $("chart-preview").src = chartImage;
    $("chart-preview").style.display = "block";
    $("chart-submit").disabled = false;
  } catch (err) { sizeError(err.message); }
};

$("chart-submit").onclick = async () => {
  $("chart-submit").disabled = true;
  $("size-result").replaceChildren();
  $("size-status").replaceChildren(el("div", { class: "card loading" }, el("div", { class: "spinner" }), "讀取尺寸表中…"));
  try {
    chart = await postJSON("/api/size-chart", { image: chartImage });
    if (chart.category !== category) { category = chart.category; renderRefFields(); }
    $("size-status").replaceChildren();
    await recompute();
    $("size-result").scrollIntoView({ behavior: "smooth" });
  } catch (err) {
    sizeError(err.message);
  } finally {
    $("chart-submit").disabled = false;
  }
};

let recomputeSeq = 0;
async function recompute() {
  const seq = ++recomputeSeq;
  let rec = null, error = null;
  try {
    rec = await postJSON("/api/recommend-size", { chart, reference: reference[chart.category] });
  } catch (err) { error = err.message; }
  if (seq === recomputeSeq) renderSize(rec, error);
}

function renderSize(rec, error) {
  const labels = measures[chart.category];
  const out = [];
  if (error) {
    out.push(el("div", { class: "card error" }, error));
  } else {
    out.push(el("section", { class: "card" },
      el("h2", {}, "推薦尺寸"),
      el("div", { class: "big-size" }, rec.recommended),
      ...rec.warnings.map((w) => el("p", { class: "warn" }, "⚠️ " + w)),
      chart.notes ? el("p", { class: "hint" }, "尺寸表備註：" + chart.notes) : "",
      chart.stretch ? el("p", { class: "hint" }, "彈性布料：偏緊一點也可以接受，已放寬計算。") : "",
      ...rec.sizes.map((s) => el("div", { class: "size-row" + (s.size === rec.recommended ? " best" : "") },
        el("h3", {}, s.size),
        el("div", { class: "verdicts" }, ...s.fits.map((f) => el("span", { class: "verdict " + (f.verdict === "剛好" ? "ok" : "off") },
          `${f.label} ${f.verdict}（${f.diff > 0 ? "+" : ""}${f.diff}）`))),
      )),
    ));
  }
  // The table Claude read, editable so misread numbers can be fixed.
  const keys = Object.keys(labels).filter((k) => chart.sizes.some((s) => s[k] != null));
  const rows = chart.sizes.map((s) => el("tr", {}, el("th", {}, s.size), ...keys.map((k) => {
    const input = el("input", { type: "number", inputmode: "decimal", step: "0.5" });
    input.value = s[k] ?? "";
    input.onchange = () => {
      const v = parseFloat(input.value);
      if (Number.isFinite(v) && v > 0) s[k] = v; else delete s[k];
      recompute();
    };
    return el("td", {}, input);
  })));
  out.push(el("section", { class: "card" },
    el("h2", {}, "讀到的尺寸表（平量，公分）"),
    el("p", { class: "hint" }, "請對照截圖檢查，數字讀錯可以直接修改，結果會自動更新。圍度已換算成平量寬度。"),
    el("div", { class: "chart-scroll" }, el("table", { class: "chart-table" },
      el("tr", {}, el("th", {}, "尺寸"), ...keys.map((k) => el("th", {}, labels[k].label))), ...rows)),
  ));
  $("size-result").replaceChildren(...out);
}

function render(d) {
  const out = $("result");
  if (!d.is_person) {
    out.append(el("div", { class: "card" }, el("h2", {}, "需要換一張照片"), d.summary));
    return;
  }
  const c = d.current_outfit;
  out.append(el("section", { class: "card" },
    el("h2", {}, "目前穿搭"),
    el("div", { class: "score" }, el("b", {}, String(c.score)), "/ 10"),
    el("p", {}, d.summary),
    el("p", {}, c.description),
    el("div", { class: "label-good" }, "👍 做得好的地方"), list(c.strengths),
    el("div", { class: "label-warn" }, "✨ 可以更好"), list(c.improvements),
  ));
  const b = d.body_and_color;
  out.append(el("section", { class: "card" },
    el("h2", {}, "適合你的剪裁與顏色"),
    el("p", {}, b.body_notes),
    el("div", { class: "label-good" }, "推薦色"), swatches(b.flattering_colors),
    el("div", { class: "label-warn" }, "建議少用"), swatches(b.colors_to_avoid),
  ));
  d.suggestions.forEach((s, i) => {
    out.append(el("section", { class: "card look" },
      el("h3", {}, `穿搭建議 ${i + 1}：${s.title}`),
      el("table", {}, ...s.items.map((it) => el("tr", {}, el("td", {}, it.category), el("td", {}, `${it.item}（${it.color}）`)))),
      el("p", { class: "why" }, s.why),
    ));
  });
}
</script>
</body>
</html>
